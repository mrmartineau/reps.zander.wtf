id: 0 # leave as 0 — a maintainer assigns the real id on acceptance
title: "Build Your Own filter"
difficulty: easy
prompt: |
  Implement `myFilter(arr, fn)` so it works like `arr.filter(fn)` — **without
  using `.filter`**.

  Call `fn` for each item. Keep the item if `fn` returns something truthy;
  skip it otherwise.

  `fn` is called as `fn(item, index, arr)`: the item, its position, and the
  whole array.

  For example, `myFilter([1, 2, 3, 4], x => x % 2 === 0)` returns `[2, 4]`.
functionName: myFilter
starterCode: |
  function myFilter(arr, fn) {
    // your code here
  }
tests:
  - name: "Keeps the even numbers"
    args: [[1, 2, 3, 4, 5, 6], { $js: "x => x % 2 === 0" }]
    expected: [2, 4, 6]
  - name: "Keeps long words"
    args: [["hi", "hello", "hey", "howdy"], { $js: "word => word.length > 3" }]
    expected: ["hello", "howdy"]
  - name: "Nothing matches"
    args: [[1, 3, 5], { $js: "x => x % 2 === 0" }]
    expected: []
solution: |
  function myFilter(arr, fn) {
    const result = [];
    for (let i = 0; i < arr.length; i++) {
      // Only keep the item when fn says yes.
      if (fn(arr[i], i, arr)) {
        result.push(arr[i]);
      }
    }
    return result;
  }
solutionExplanation: |
  `filter` is `map` with an `if`. Loop over the items, ask `fn` about each one,
  and push the **original item** (not what `fn` returned) when the answer is
  truthy.

  "Truthy" matters: `fn` doesn't have to return exactly `true`. Any value that
  `if` treats as true counts, so use `if (fn(...))` rather than
  `if (fn(...) === true)`.

  When nothing matches you still return an array — just an empty one.
