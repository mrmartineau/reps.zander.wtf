id: 0 # leave as 0 — a maintainer assigns the real id on acceptance
title: "Build Your Own some"
difficulty: easy
prompt: |
  Implement `mySome(arr, fn)` so it works like `arr.some(fn)` — **without
  using `.some`**.

  Return `true` if `fn` returns something truthy for **at least one** item.
  Otherwise return `false`.

  `fn` is called as `fn(item, index, arr)`: the item, its position, and the
  whole array.

  For example, `mySome([1, 3, 4], x => x % 2 === 0)` returns `true`, because
  `4` is even.
functionName: mySome
starterCode: |
  function mySome(arr, fn) {
    // your code here
  }
tests:
  - name: "One even number"
    args: [[1, 3, 4, 7], { $js: "x => x % 2 === 0" }]
    expected: true
  - name: "No even numbers"
    args: [[1, 3, 5], { $js: "x => x % 2 === 0" }]
    expected: false
  - name: "Empty array"
    args: [[], { $js: "x => true" }]
    expected: false
solution: |
  function mySome(arr, fn) {
    for (let i = 0; i < arr.length; i++) {
      // One yes is enough.
      if (fn(arr[i], i, arr)) {
        return true;
      }
    }
    return false;
  }
solutionExplanation: |
  `some` asks "does **any** item pass?". As soon as one does, you know the
  answer is `true`, so return straight away.

  If the loop ends, no item passed, so the answer is `false`.

  The empty array is the edge case. There are no items, so none can pass —
  even with `x => true`. The loop never runs and you fall through to
  `return false`.
