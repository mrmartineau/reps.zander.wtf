id: 143
title: "Reverse a Linked List"
difficulty: medium
prompt: |
  Implement `reverseList(head)`.

  A **linked list** is a chain of nodes. Each node is an object
  `{ val, next }`. `next` is the next node, or `null` at the end of the list.
  `head` is the first node, or `null` if the list is empty.

  Reverse the list, and return the new first node.

  For example, the list `1 → 2 → 3` becomes `3 → 2 → 1`:

  ```js
  reverseList({ val: 1, next: { val: 2, next: { val: 3, next: null } } });
  // { val: 3, next: { val: 2, next: { val: 1, next: null } } }
  ```

  The tests use `1 → 2 → 3`, then `10 → 20 → 30 → 40 → 50`, then an empty
  list (`null`).
functionName: reverseList
starterCode: |
  function reverseList(head) {
    // your code here
  }
tests:
  - name: "Three nodes"
    args:
      - { val: 1, next: { val: 2, next: { val: 3, next: null } } }
    expected: { val: 3, next: { val: 2, next: { val: 1, next: null } } }
  - name: "Five nodes"
    args:
      - { val: 10, next: { val: 20, next: { val: 30, next: { val: 40, next: { val: 50, next: null } } } } }
    expected: { val: 50, next: { val: 40, next: { val: 30, next: { val: 20, next: { val: 10, next: null } } } } }
  - name: "Empty list"
    args: [null]
    expected: null
solution: |
  function reverseList(head) {
    let prev = null; // the part we have already reversed
    let curr = head; // the part still to do

    while (curr) {
      const next = curr.next; // save the rest of the list
      curr.next = prev; // turn this node around
      prev = curr; // move both pointers one step forward
      curr = next;
    }

    return prev; // the old last node is the new first node
  }
solutionExplanation: |
  The trick is to **turn each arrow around, one node at a time**, while you
  walk the list.

  You can't jump to the end of a linked list. You only have `head`, and each
  node only knows the node after it. So walk from the front and keep two
  pointers:

  - `prev`: the nodes you have already reversed. It starts as `null`, because
    the old first node becomes the new last node.
  - `curr`: the node you are on now.

  For each node, point `curr.next` back at `prev`. **But first save
  `curr.next`**. When you change the arrow, you lose the only link to the rest
  of the list. That's the step people forget.

  Here's `1 → 2 → 3`:

  | Step   | `prev`         | `curr`      |
  | ------ | -------------- | ----------- |
  | start  | `null`         | `1 → 2 → 3` |
  | 1      | `1`            | `2 → 3`     |
  | 2      | `2 → 1`        | `3`         |
  | 3      | `3 → 2 → 1`    | `null`      |

  When `curr` is `null`, you're done, and `prev` is the new head.

  **The empty list** works without a special case: the loop never runs, and
  you return `prev`, which is `null`.

  **You might have tried** copying the values into an array, reversing it, and
  building new nodes. That works, but it uses extra memory. The pointer swap
  does it in place, with one pass and no extra array.
