id: 139
title: "Build an LRU Cache"
difficulty: hard
prompt: |
  Implement `lruCache(capacity, ops)`.

  A cache stores values by key, but it holds at most `capacity` keys. When it
  is full and you add a new key, it removes the **least recently used** key:
  the key that you have not read or written for the longest time.

  `ops` is a list of operations to run in order:

  - `["put", key, value]`: store `value` under `key`. If the key is already
    there, change its value.
  - `["get", key]`: read the value for `key`, or `-1` if it is not in the
    cache.

  Both `put` and `get` count as **using** a key.

  Return an array with the result of each `get`, in order.

  For example, with `capacity` `2`:

  ```js
  lruCache(2, [
    ["put", 1, 1],
    ["put", 2, 2],
    ["get", 1], // 1. Now key 2 is the least recently used.
    ["put", 3, 3], // full, so remove key 2
    ["get", 2], // -1
    ["put", 4, 4], // full, so remove key 1
    ["get", 1], // -1
    ["get", 3], // 3
    ["get", 4], // 4
  ]); // [1, -1, -1, 3, 4]
  ```

  The second test changes the value of a key that is already there. The third
  test has a `capacity` of `1`.
functionName: lruCache
starterCode: |
  function lruCache(capacity, ops) {
    // your code here
  }
tests:
  - name: "Removes the least recently used"
    args:
      - 2
      - - ["put", 1, 1]
        - ["put", 2, 2]
        - ["get", 1]
        - ["put", 3, 3]
        - ["get", 2]
        - ["put", 4, 4]
        - ["get", 1]
        - ["get", 3]
        - ["get", 4]
    expected: [1, -1, -1, 3, 4]
  - name: "Changing a value counts as a use"
    args:
      - 2
      - - ["put", 1, 1]
        - ["put", 2, 2]
        - ["put", 1, 10]
        - ["put", 3, 3]
        - ["get", 1]
        - ["get", 2]
        - ["get", 3]
    expected: [10, -1, 3]
  - name: "Room for only one"
    args:
      - 1
      - - ["put", 1, 1]
        - ["get", 1]
        - ["put", 2, 2]
        - ["get", 1]
        - ["get", 2]
    expected: [1, -1, 2]
solution: |
  function lruCache(capacity, ops) {
    // A Map remembers the order you added keys: the oldest key comes first.
    const cache = new Map();
    const results = [];

    for (const [op, key, value] of ops) {
      if (op === "get") {
        if (!cache.has(key)) {
          results.push(-1);
          continue;
        }
        const found = cache.get(key);
        // Remove and add again, to move the key to the "newest" end.
        cache.delete(key);
        cache.set(key, found);
        results.push(found);
      } else {
        cache.delete(key); // so an old key moves to the "newest" end too
        cache.set(key, value);
        if (cache.size > capacity) {
          // The first key is the least recently used.
          cache.delete(cache.keys().next().value);
        }
      }
    }

    return results;
  }
solutionExplanation: |
  The trick is to **keep the keys in order of use**: least recently used at
  the front, most recently used at the back. Then:

  - **Using** a key means moving it to the back.
  - **Removing** the least recently used key means removing the one at the
    front.

  A JavaScript `Map` already keeps its keys in the order you added them. And
  you can move a key to the back: `delete` it, then `set` it again. So:

  - `get`: if the key is there, delete it and set it again (it's now the
    newest), then return the value. If not, return `-1`.
  - `put`: delete the key (if it's there), then set it. Now it's the newest.
    If the cache has too many keys, delete the first one.
    `cache.keys().next().value` gives you the first key.

  **The gotcha is test 2.** Changing the value of key `1` counts as a use. If
  you only do `cache.set(1, 10)`, a `Map` changes the value but keeps the key
  in its **old** place. Then `1` is still the oldest, and it gets removed
  instead of `2`. The `delete` before the `set` fixes that.

  **In an interview**, you'll often hear "a hash map plus a doubly linked
  list". The hash map finds a node fast. The linked list keeps the order, and
  can move or remove a node in one step. Every operation is **O(1)**. A `Map`
  gives you the same result here.

  **You might have tried** an array of keys in order of use. That works, but
  each move needs `indexOf` and `splice`, which are slow for big caches.
